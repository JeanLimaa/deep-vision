[project]
name = "assistive-vision-server"
version = "0.1.0"
description = "Servidor Edge-to-Cloud do sistema assistivo para deficientes visuais (TCC)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.10",
    "websockets>=13.0",
]

[project.optional-dependencies]
# Deteccao real (YOLO). Sem isso o servidor usa o detector simulado.
vision = [
    "ultralytics>=8.3",
    "torch>=2.4",
    "torchvision>=0.19",
]
# Sintese de voz offline + reproducao no alto-falante do proprio servidor.
audio = [
    "pyttsx3>=2.98",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]
# Reconhecimento de fala offline (comandos de voz).
speech = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # str + Enum e deliberado: os valores viajam como JSON no protocolo e
    # precisam se comparar diretamente com strings vindas da rede.
    "UP042",
    # Listas de palavras escritas como texto e divididas com split() sao bem
    # mais legiveis do que dezenas de literais entre aspas.
    "SIM905",
]
