; Firmware do no de borda.
;
; Tres ambientes, porque a escolha da placa muda o que cabe no prototipo:
;
;   esp32cam        AI-Thinker ESP32-CAM. Barata e disponivel, mas quase todos
;                   os GPIOs estao ocupados pela camera e pelo slot SD. Cabem
;                   camera + 1 sensor ultrassonico + buzzer + 1 botao.
;   esp32cam_pcf    Mesma placa, com expansor de I/O PCF8574 no barramento I2C.
;                   Libera os quatro botoes descritos no TCC sem sacrificar o
;                   sensor.
;   esp32s3_sense   XIAO ESP32-S3 Sense. Tem PSRAM, microfone digital embutido e
;                   GPIOs sobrando -- e a unica das tres que comporta o projeto
;                   completo (camera + sonar + 4 botoes + microfone + alto-falante).
;
; Compilar e gravar:  pio run -e esp32cam -t upload && pio device monitor

[platformio]
default_envs = esp32cam

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32cam]
platform = espressif32@^6.7.0
board = esp32cam
board_build.f_cpu = 240000000L
build_flags =
    ${env.build_flags}
    -DBOARD_AI_THINKER=1
    -DHAS_I2C_EXPANDER=0
    -DHAS_I2S_SPEAKER=0
    -DHAS_I2S_MICROPHONE=0

[env:esp32cam_pcf]
platform = espressif32@^6.7.0
board = esp32cam
build_flags =
    ${env.build_flags}
    -DBOARD_AI_THINKER=1
    -DHAS_I2C_EXPANDER=1
    -DHAS_I2S_SPEAKER=0
    -DHAS_I2S_MICROPHONE=0

[env:esp32s3_sense]
platform = espressif32@^6.7.0
board = seeed_xiao_esp32s3
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_S3=1
    -DHAS_I2C_EXPANDER=0
    -DHAS_I2S_SPEAKER=1
    -DHAS_I2S_MICROPHONE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
