; Firmware do no de borda.
;
; Quatro ambientes, porque a placa disponivel muda o que cabe no prototipo:
;
;   bench_sonar     Banco de teste na AI-Thinker. So o HC-SR04 e o buzzer, sem
;                   Wi-Fi e sem camera. E o primeiro contato com o hardware:
;                   valida a ligacao, a medida e as zonas de proximidade no
;                   monitor serial, antes de qualquer coisa depender de rede.
;                   (bench_sonar_devkit e a mesma coisa num ESP32 comum.)
;   esp32devkit     ESP32 DevKit v1 comum, sem camera. Entrega a camada de
;                   seguranca completa (sonar, zonas, buzzer, 4 botoes,
;                   telemetria ao servidor); o video fica por conta do simulador.
;   esp32cam        AI-Thinker ESP32-CAM. Barata e disponivel, mas quase todos
;                   os GPIOs estao ocupados pela camera e pelo slot SD. Cabem
;                   camera + 1 sensor ultrassonico + buzzer + 1 botao.
;   esp32cam_pcf    Mesma placa, com expansor de I/O PCF8574 no barramento I2C.
;                   Libera os quatro botoes descritos no TCC sem sacrificar o
;                   sensor.
;   esp32s3_sense   XIAO ESP32-S3 Sense. Tem PSRAM, microfone digital embutido e
;                   GPIOs sobrando -- e a unica que comporta o projeto completo
;                   (camera + sonar + 4 botoes + microfone + alto-falante).
;
; Compilar e gravar:  pio run -e <ambiente> -t upload && pio device monitor

[platformio]
default_envs = esp32cam

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
; O banco de teste tem seu proprio main(); fora dele o arquivo fica de fora.
build_src_filter = +<*> -<bench_sonar.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11

; --------------------------------------------------------------- bancada

; Base comum dos bancos de teste: so o sonar e o buzzer, sem rede e sem camera.
[bench]
; Compila apenas o banco de teste e os dois modulos que ele exercita.
build_src_filter = -<*> +<bench_sonar.cpp> +<ultrasonic.cpp> +<alerts.cpp>
lib_deps =

[env:bench_sonar]
platform = espressif32@^6.7.0
board = esp32cam
build_src_filter = ${bench.build_src_filter}
lib_deps = ${bench.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_AI_THINKER=1
    -DHAS_CAMERA=0
    -DHAS_I2C_EXPANDER=0
    -DHAS_I2S_SPEAKER=0
    -DHAS_I2S_MICROPHONE=0

[env:bench_sonar_devkit]
platform = espressif32@^6.7.0
board = esp32dev
build_src_filter = ${bench.build_src_filter}
lib_deps = ${bench.lib_deps}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_DEVKIT=1
    -DHAS_CAMERA=0
    -DHAS_I2C_EXPANDER=0
    -DHAS_I2S_SPEAKER=0
    -DHAS_I2S_MICROPHONE=0

[env:esp32devkit]
platform = espressif32@^6.7.0
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_DEVKIT=1
    -DHAS_CAMERA=0
    -DHAS_I2C_EXPANDER=0
    -DHAS_I2S_SPEAKER=0
    -DHAS_I2S_MICROPHONE=0

; ------------------------------------------------------- placas com camera

[env:esp32cam]
platform = espressif32@^6.7.0
board = esp32cam
board_build.f_cpu = 240000000L
build_flags =
    ${env.build_flags}
    -DBOARD_AI_THINKER=1
    -DHAS_CAMERA=1
    -DHAS_I2C_EXPANDER=0
    -DHAS_I2S_SPEAKER=0
    -DHAS_I2S_MICROPHONE=0

[env:esp32cam_pcf]
platform = espressif32@^6.7.0
board = esp32cam
build_flags =
    ${env.build_flags}
    -DBOARD_AI_THINKER=1
    -DHAS_CAMERA=1
    -DHAS_I2C_EXPANDER=1
    -DHAS_I2S_SPEAKER=0
    -DHAS_I2S_MICROPHONE=0

[env:esp32s3_sense]
platform = espressif32@^6.7.0
board = seeed_xiao_esp32s3
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_S3=1
    -DHAS_CAMERA=1
    -DHAS_I2C_EXPANDER=0
    -DHAS_I2S_SPEAKER=1
    -DHAS_I2S_MICROPHONE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
